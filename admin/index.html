<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — MaDE Studio</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-card">
    <h1>MaDE Studio</h1>
    <p class="sub">Админ-панель</p>
    <label>
      <span>Логин</span>
      <input type="text" name="username" autocomplete="username" required>
    </label>
    <label>
      <span>Пароль</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn-solid">Войти</button>
    <p id="loginError" class="error" hidden></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="admin-header">
    <div class="admin-header-left">
      <span class="brand">MaDE Studio · Админка</span>
      <span id="whoami" class="whoami"></span>
    </div>
    <button id="logoutBtn" class="btn-outline">Выйти</button>
  </header>

  <div class="layout">
    <nav class="page-nav" id="pageNav" aria-label="Страницы сайта"></nav>

    <main class="editor">
      <div class="editor-head">
        <h2 id="pageTitle">—</h2>
        <div class="editor-actions">
          <span id="saveStatus" class="save-status"></span>
          <button id="saveBtn" class="btn-solid" disabled>Сохранить изменения</button>
        </div>
      </div>
      <div id="fieldsList" class="fields-list"></div>
    </main>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="admin.js"></script>
</body>
</html>
