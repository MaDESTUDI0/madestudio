<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaDE - Творческое ателье</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo script-font">MaDE</div>
            <nav class="nav">
                <a href="#" class="nav__link">Главная</a>
                <a href="#courses" class="nav__link">Обучение</a>
                <a href="#gallery" class="nav__link">Галерея</a>
                <a href="#shop" class="nav__link">Магазин</a>
                <a href="#about" class="nav__link">О MaDE</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="hero__text">
                <span class="hero__subtitle">Добро пожаловать</span>
                <h1 class="hero__title">Откройте свой <span>творческий</span> потенциал</h1>
                <p>Научитесь создавать прекрасное в нашем ателье</p>
                <div class="hero__buttons">
                    <button class="cta-button">Начать обучение</button>
                    <button class="cta-button cta-button--outline">Узнать больше</button>
                </div>
            </div>
            <div class="hero__visual">
                <div class="placeholder"></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 MaDE. Все права защищены</p>
        </div>
    </footer>
</body>
</html>
